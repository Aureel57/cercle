<style>
:root{
  --bg:#F7F3EA;--bgw:#F0EADB;--w:#FFFFFF;
  --dk:#20242F;--tx:#343A46;--g:#6A7078;--gl:#A39B89;--bd:#E8E1D2;
  --p:#2C50C8;--pd:#1F3CA6;--ter:#DA6740;--terd:#C2552F;--sun:#EFA528;
  --green:#1F8150;--greend:#15623C;--plus:#7C3AED;
  --fd:'Bricolage Grotesque',system-ui,sans-serif;--f:'Instrument Sans',system-ui,sans-serif;
  --r:14px;--rl:18px;
  --sh:0 1px 2px rgba(32,36,47,.05),0 4px 14px rgba(32,36,47,.05);
  --shf:4px 4px 0 rgba(32,36,47,.12);
  --ease:cubic-bezier(.22,1,.36,1);
}
html.dark{
  --bg:#14171F;--bgw:#1A1F2B;--w:#1E2433;
  --dk:#F0EFE9;--tx:#D9D6CC;--g:#9AA0AC;--gl:#6E7480;--bd:#272D3A;
  --p:#7E9BFF;--pd:#5F82F2;--ter:#FF8E68;--terd:#E9744D;--sun:#FFC369;
  --green:#5BD992;--greend:#3FB876;
  --sh:0 2px 8px rgba(0,0,0,.45);--shf:4px 4px 0 rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s;overflow-x:hidden}
::selection{background:var(--sun);color:#20242F}
h1,h2,h3,.fd{font-family:var(--fd);color:var(--dk);line-height:1.12}
button{font-family:var(--f);cursor:pointer}
input,textarea,select{font-family:var(--f)}
:focus-visible{outline:3px solid var(--ter);outline-offset:2px;border-radius:4px}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ═══ HEADER ═══ */
.hdr{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1.5px solid color-mix(in srgb,var(--dk) 16%,transparent)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;background:none;border:none}
.logo .lt{font-family:var(--fd);font-size:23px;font-weight:700;color:var(--dk);letter-spacing:-.02em}
.nav-d{display:flex;gap:2px}
.nav-d button{background:none;border:none;font-size:14px;font-weight:600;color:var(--g);padding:9px 14px;border-radius:999px;transition:all .2s var(--ease);position:relative}
.nav-d button:hover{color:var(--dk);background:var(--bgw)}
.nav-d button.on{color:var(--p);background:color-mix(in srgb,var(--p) 10%,transparent)}
.hdr-r{display:flex;align-items:center;gap:9px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--bd);background:var(--w);color:var(--dk);display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.icon-btn:hover{border-color:var(--dk);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:none;border-radius:12px;font-weight:700;font-size:14px;padding:11px 20px;min-height:42px;transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .2s;text-decoration:none}
.btn-ter{background:var(--ter);color:#fff}
.btn-ter:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 color-mix(in srgb,var(--dk) 80%,transparent)}
.btn-ter:active{transform:translate(0,0);box-shadow:none}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 color-mix(in srgb,var(--dk) 80%,transparent)}
.btn-ghost{background:var(--w);color:var(--dk);border:1.5px solid var(--bd)}
.btn-ghost:hover{border-color:var(--dk)}

/* ═══ HERO RADAR ═══ */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;max-width:1180px;margin:0 auto;padding:clamp(34px,5.5vw,60px) 24px clamp(26px,4vw,44px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--w);border:1.5px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--dk);margin-bottom:18px;box-shadow:var(--sh)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.hero h1{font-size:clamp(33px,4.5vw,54px);font-weight:800;letter-spacing:-.02em}
.hero h1 .bl{color:var(--p)}
.sould{position:relative;white-space:nowrap}
.sould svg{position:absolute;left:0;bottom:-6px;width:100%;height:10px;overflow:visible}
.sould path{stroke:var(--ter);stroke-width:4.5;fill:none;stroke-linecap:round}
.hero .sub{color:var(--g);font-size:clamp(14px,1.6vw,16px);max-width:46ch;margin:16px 0 22px;line-height:1.65}
.hsearch{display:flex;align-items:center;gap:10px;background:var(--w);border:2px solid var(--dk);border-radius:16px;padding:7px 7px 7px 16px;max-width:520px;box-shadow:var(--shf)}
.hsearch svg{color:var(--g);flex-shrink:0}
.hsearch input{flex:1;border:none;outline:none;font-size:15px;color:var(--dk);background:none;min-width:0}
.hsearch input::placeholder{color:var(--gl)}
.proof{display:flex;gap:20px;margin-top:22px;align-items:center;flex-wrap:wrap}
.proof b{font-family:var(--fd);font-size:20px;color:var(--dk);display:block;line-height:1.1}
.proof span{font-size:12px;color:var(--g)}
.proof .sep{width:1px;height:30px;background:var(--bd)}
.radar{position:relative;height:clamp(320px,36vw,420px)}
.radar svg.rings{position:absolute;inset:0;width:100%;height:100%}
.rings circle{fill:none;stroke:var(--bd);stroke-width:1.5}
.rings circle.dash{stroke-dasharray:2 8;stroke-linecap:round}
.rings text{font-family:var(--f);font-size:10px;fill:var(--gl);font-weight:600}
.you{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--dk);color:var(--bg);font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;z-index:3;white-space:nowrap}
.you i{position:absolute;left:50%;top:50%;width:30px;height:30px;border:2px solid var(--p);border-radius:50%;transform:translate(-50%,-50%);opacity:0;animation:pulse 2.4s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{opacity:.5;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
.ping{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;z-index:2;transform:translate(-50%,-50%);background:none;border:none;will-change:transform}
.ping .ph{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--w);box-shadow:0 4px 14px rgba(32,36,47,.25);overflow:hidden;position:relative;background:var(--w)}
.ping .ph img{width:100%;height:100%;object-fit:cover}
.ping .pt{position:absolute;right:0;bottom:13px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid var(--w);z-index:2}
.ping .lbl{background:var(--w);border:1.5px solid var(--bd);border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:700;color:var(--dk);white-space:nowrap;box-shadow:var(--sh)}
.ping .lbl b{color:var(--green)}
.ping:hover .ph{border-color:var(--p)}

/* ═══ CATÉGORIES ═══ */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 24px 18px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--bd);background:var(--w);font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;transition:all .18s var(--ease);flex-shrink:0;min-height:40px}
.cat svg{width:15px;height:15px}
.cat:hover{border-color:var(--dk);transform:translateY(-1px)}
.cat.on{background:var(--p);border-color:var(--p);color:#fff}

/* ═══ GRILLE & CARTES ═══ */
.sec-t{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--dk);letter-spacing:-.01em;display:flex;align-items:baseline;gap:12px}
.sec-t small{font-size:13px;color:var(--g);font-family:var(--f);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;padding:18px 0 56px}
.card{background:var(--w);border:1.5px solid color-mix(in srgb,var(--dk) 13%,transparent);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;position:relative}
.card:hover{transform:translate(-3px,-3px);border-color:var(--dk);box-shadow:6px 6px 0 color-mix(in srgb,var(--dk) 13%,transparent)}
.card .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bgw)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card:hover .ph img{transform:scale(1.05)}
.stamp{position:absolute;top:10px;left:10px;z-index:2;width:46px;height:46px;border-radius:50%;border:2px solid var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--w) 90%,transparent);color:var(--green);transform:rotate(-9deg);font-size:6.5px;font-weight:800;letter-spacing:.05em;line-height:1.25}
.stamp::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed var(--green)}
.stamp .ck{font-size:11px;line-height:1}
.dist{position:absolute;bottom:10px;left:10px;z-index:2;background:color-mix(in srgb,#20242F 86%,transparent);backdrop-filter:blur(6px);color:#fff;padding:5px 11px;border-radius:999px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.fav{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--w) 92%,transparent);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--dk);transition:transform .2s var(--ease)}
.fav:hover{transform:scale(1.12)}
.fav.on{color:var(--ter);border-color:var(--ter)}
.card .in{padding:14px 16px 16px}
.card .tt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .tt h3{font-size:15.5px;font-weight:700;font-family:var(--f);color:var(--dk);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .note{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--dk);flex-shrink:0}
.card .note svg{color:var(--sun)}
.card .own{font-size:12.5px;color:var(--g);margin-top:4px}
.card .foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:11px;border-top:1px dashed var(--bd)}
.prix{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--green)}
.prix small{font-size:12px;font-weight:500;color:var(--g);font-family:var(--f)}
.marche{font-size:12px;color:var(--g);font-style:italic}

/* ═══ FOOTER ═══ */
footer{border-top:1.5px solid color-mix(in srgb,var(--dk) 14%,transparent);background:var(--bgw);margin-top:30px}
footer .wrap{padding:46px 24px 28px}
.f-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px;margin-bottom:34px}
.f-grid h4{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gl);margin-bottom:12px;font-family:var(--f)}
.f-grid a{display:block;font-size:13.5px;color:var(--g);text-decoration:none;padding:4px 0;cursor:pointer}
.f-grid a:hover{color:var(--p)}
.f-low{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding-top:18px;font-size:12px;color:var(--g);flex-wrap:wrap;gap:10px}
.f-low a{color:var(--g);text-decoration:none}.f-low a:hover{color:var(--p)}
/* bandeau cookies */
.ckb{position:fixed;left:12px;right:12px;bottom:12px;z-index:300;max-width:600px;margin:0 auto;background:var(--w);border:2px solid var(--dk);border-radius:16px;box-shadow:var(--shf);padding:15px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ckb p{font-size:13px;color:var(--tx);flex:1;min-width:200px;line-height:1.5}
.ckb p a{color:var(--p);cursor:pointer;text-decoration:underline}
.ckb .ckb-btns{display:flex;gap:8px;flex-shrink:0}
@media(max-width:920px){.ckb{bottom:84px}}

/* ═══ DÉTAIL ═══ */
.det{max-width:1180px;margin:0 auto;padding:20px 24px 70px}
.back{display:inline-flex;align-items:center;gap:7px;background:var(--w);border:1.5px solid var(--bd);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--dk);margin-bottom:18px;transition:all .2s}
.back:hover{border-color:var(--dk)}
.det-gal{display:grid;grid-template-columns:2fr 1fr;gap:10px;border-radius:var(--rl);overflow:hidden;margin-bottom:24px}
.det-gal .g0{aspect-ratio:16/10;position:relative}
.det-gal .gcol{display:grid;grid-template-rows:1fr 1fr;gap:10px}
.det-gal img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--dk) 12%,transparent)}
/* galerie multi-photos : image principale + miniatures */
.gal{margin-bottom:24px}
.gal .g0{aspect-ratio:16/10;position:relative;border-radius:var(--rl);overflow:hidden}
.gal .g0 img{width:100%;height:100%;object-fit:cover;border-radius:var(--rl);border:1.5px solid color-mix(in srgb,var(--dk) 12%,transparent)}
.gthumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.gth{flex:0 0 auto;width:88px;height:62px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:none;cursor:pointer;transition:border-color .15s}
.gth img{width:100%;height:100%;object-fit:cover;display:block}
.gth.on{border-color:var(--ter)}
.gth:hover{border-color:color-mix(in srgb,var(--dk) 30%,transparent)}
.det-body{display:grid;grid-template-columns:1fr 390px;gap:36px;align-items:start}
.det h1{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.det .meta{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--g);flex-wrap:wrap}
.det .meta b{color:var(--dk)}
.det .meta .st{color:var(--sun)}
.trajet{display:inline-flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--p) 9%,transparent);border:1px solid color-mix(in srgb,var(--p) 25%,transparent);border-radius:12px;padding:10px 16px;margin:14px 0 20px;font-size:13.5px;font-weight:700;color:var(--p)}
.guars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.guar{background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:13px 15px}
.guar b{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--dk);margin-bottom:3px}
.guar b svg{color:var(--green);flex-shrink:0}
.guar span{font-size:12px;color:var(--g)}
.det h3.sh{font-family:var(--fd);font-size:18px;margin:20px 0 8px}
.det p.desc{max-width:60ch;color:var(--tx)}
.owner-card{display:flex;align-items:center;gap:13px;background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:14px 16px;margin-top:18px;max-width:430px}
.avat{width:46px;height:46px;border-radius:50%;background:var(--p);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--fd);overflow:hidden}
.avat img{width:100%;height:100%;object-fit:cover}
.icon-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.owner-card .nm{font-weight:700;color:var(--dk);font-size:14.5px}
.owner-card .sb{font-size:12px;color:var(--g)}
.owner-card button{margin-left:auto}
/* ticket réservation */
.ticket{position:sticky;top:88px;background:var(--w);border:2px solid var(--dk);border-radius:var(--rl);box-shadow:var(--shf);overflow:hidden}
.ticket .th{padding:20px 22px 14px;display:flex;justify-content:space-between;align-items:baseline}
.ticket .th .prix{font-size:26px}
.caution{font-size:11px;font-weight:800;color:var(--green);border:2px solid var(--green);border-radius:999px;padding:5px 11px;transform:rotate(-3deg);letter-spacing:.03em}
.ticket .tb{padding:0 22px 22px}
.cal{border:1.5px solid var(--bd);border-radius:12px;padding:12px;background:var(--bg);margin-bottom:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-family:var(--fd);font-size:14px;text-transform:capitalize;color:var(--dk)}
.cal-h button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--bd);background:var(--w);cursor:pointer;font-size:16px;color:var(--dk);line-height:1;display:flex;align-items:center;justify-content:center}
.cal-h button:disabled{opacity:.3;cursor:default}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-dow span{text-align:center;font-size:10px;font-weight:700;color:var(--gl)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-d{aspect-ratio:1;border:none;background:none;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--dk);cursor:pointer;font-family:var(--f);padding:0}
.cal-d:hover:not(:disabled){background:color-mix(in srgb,var(--ter) 16%,transparent)}
.cal-d.off{color:var(--gl);text-decoration:line-through;cursor:not-allowed;opacity:.45}
.cal-d.tdy{box-shadow:inset 0 0 0 1.5px var(--p)}
.cal-d.rng{background:color-mix(in srgb,var(--ter) 20%,transparent);border-radius:4px}
.cal-d.sel{background:var(--ter);color:#fff}
.cal-lg{display:flex;gap:14px;font-size:11px;color:var(--g);margin-top:8px;flex-wrap:wrap}
.cal-lg i{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px}
.dates{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--bg)}
.dates>label{padding:10px 14px;cursor:pointer}
.dates>label:first-child{border-right:1.5px solid var(--bd)}
.dates span{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
.dates input{border:none;background:none;font-family:var(--f);font-size:14px;font-weight:700;color:var(--dk);width:100%;outline:none}
.calc{display:flex;flex-direction:column;gap:8px;border-top:1.5px dashed var(--bd);padding-top:14px}
.calc .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--g)}
.calc .row b{color:var(--dk);font-weight:600}
.calc .tot{display:flex;justify-content:space-between;border-top:1.5px dashed var(--bd);padding-top:12px;margin-top:5px;font-weight:800;color:var(--dk);font-size:16px}
.calc .tot b{font-family:var(--fd);font-size:19px;color:var(--green)}
.ticket .btn-green{width:100%;margin-top:14px;padding:14px;font-size:15px}
.ticket .note{text-align:center;font-size:11.5px;color:var(--g);margin-top:10px}
.ticket .perfo{position:relative;height:0;border-top:2px dashed var(--bd);margin:0 -8px}
.ticket .perfo::before,.ticket .perfo::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--dk)}
.ticket .perfo::before{left:-10px;border-left-color:transparent;border-top-color:transparent}
.ticket .perfo::after{right:-10px}

/* ═══ PAGES SIMPLES ═══ */
.page{max-width:880px;margin:0 auto;padding:28px 24px 80px}
.page h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.page .lead{color:var(--g);margin-bottom:26px}
.panel{background:var(--w);border:1.5px solid var(--bd);border-radius:var(--rl);padding:24px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dk);margin-bottom:6px}
.fg input,.fg textarea,.fg select{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;font-size:14px;background:var(--bg);color:var(--dk);outline:none;transition:border-color .2s,box-shadow .2s}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 12%,transparent)}
.fg textarea{min-height:90px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* messages */
.msg-l{display:flex;flex-direction:column;gap:10px}
.conv{display:flex;gap:12px;align-items:center;background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s var(--ease);text-align:left;width:100%}
.conv:hover{border-color:var(--dk);transform:translate(-2px,-2px);box-shadow:4px 4px 0 color-mix(in srgb,var(--dk) 10%,transparent)}
.conv .nm{font-weight:700;color:var(--dk);font-size:14px}
.conv .lm{font-size:12.5px;color:var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.conv .when{margin-left:auto;font-size:11px;color:var(--gl);flex-shrink:0}
.bubs{display:flex;flex-direction:column;gap:8px;padding:18px 0}
.bub{max-width:70%;padding:11px 15px;border-radius:16px;font-size:13.5px;line-height:1.5}
.bub.me{background:var(--p);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub.th{background:var(--w);border:1.5px solid var(--bd);color:var(--tx);align-self:flex-start;border-bottom-left-radius:4px}
.mip{display:flex;gap:8px}
.mip input{flex:1;padding:12px 16px;border:1.5px solid var(--bd);border-radius:999px;background:var(--w);font-size:13.5px;color:var(--dk);outline:none}
.mip input:focus{border-color:var(--p)}
/* profil */
.prof-h{display:flex;gap:18px;align-items:center;background:var(--w);border:1.5px solid var(--bd);border-radius:var(--rl);padding:22px 24px;margin-bottom:18px}
.prof-h .avat{width:64px;height:64px;font-size:24px}
.prof-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.pstat{background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:16px;text-align:center}
.pstat b{font-family:var(--fd);font-size:24px;color:var(--dk);display:block}
.pstat span{font-size:12px;color:var(--g)}
.plus-line{display:flex;align-items:center;gap:10px;border:1.5px solid color-mix(in srgb,var(--plus) 35%,transparent);background:color-mix(in srgb,var(--plus) 7%,transparent);color:var(--plus);border-radius:14px;padding:13px 16px;font-size:13.5px;font-weight:700;margin-bottom:18px}
.empty{text-align:center;padding:70px 20px;color:var(--g)}
.empty .big{font-family:var(--fd);font-size:21px;color:var(--dk);margin-bottom:6px}

/* ═══ NAV MOBILE ═══ */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:color-mix(in srgb,var(--w) 94%,transparent);backdrop-filter:blur(14px);border-top:1.5px solid color-mix(in srgb,var(--dk) 14%,transparent);padding:8px 10px calc(10px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
.mnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--g);min-width:48px;min-height:44px;justify-content:center}
.mnav button.on{color:var(--p)}
.mnav .fab{width:50px;height:50px;border-radius:16px;background:var(--ter);color:#fff;box-shadow:0 6px 18px rgba(218,103,64,.4);margin-top:-22px;border:3px solid var(--bg)}

/* ═══ HUB PROFIL ═══ */
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.hub>button{display:flex;align-items:center;gap:12px;background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:700;color:var(--dk);transition:all .2s var(--ease);text-align:left}
.hub>button:hover{border-color:var(--dk);transform:translate(-2px,-2px);box-shadow:4px 4px 0 color-mix(in srgb,var(--dk) 10%,transparent)}
.hub .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:color-mix(in srgb,var(--p) 9%,transparent);color:var(--p)}
.hub small{display:block;font-size:11.5px;color:var(--g);font-weight:500}
/* ═══ KPI / DASHBOARD ═══ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:16px}
.kpi b{font-family:var(--fd);font-size:25px;color:var(--dk);display:block;line-height:1.15}
.kpi span{font-size:12px;color:var(--g)}
.kpi .up{display:block;color:var(--green);font-size:11px;font-weight:700;margin-top:3px}
.chart{background:var(--w);border:1.5px solid var(--bd);border-radius:var(--rl);padding:20px 20px 36px;margin-bottom:16px}
.chart .bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:24px}
.chart .bar{flex:1;background:var(--p);border-radius:6px 6px 0 0;position:relative;min-height:6px}
.chart .bar.cur{background:var(--ter)}
.chart .bar i{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--g);font-style:normal}
.chart .bar b{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:10px;color:var(--dk)}
/* ═══ LIGNES (annonces, résa, notifs) ═══ */
.rows{display:flex;flex-direction:column;gap:10px}
.row-card{display:flex;gap:13px;align-items:center;background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:13px 16px}
.row-card img{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--bd);flex-shrink:0}
.row-card .ti{font-weight:700;color:var(--dk);font-size:14px}
.row-card .su{font-size:12px;color:var(--g)}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:5px 11px;border-radius:999px;white-space:nowrap}
.badge.green{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.badge.blue{background:color-mix(in srgb,var(--p) 11%,transparent);color:var(--p)}
.badge.sand{background:var(--bgw);color:var(--g)}
.badge.ter{background:color-mix(in srgb,var(--ter) 13%,transparent);color:var(--ter)}
.prog{height:6px;background:var(--bgw);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green);border-radius:3px}
.notif{display:flex;gap:12px;align-items:flex-start;background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:14px 44px 14px 16px;position:relative;text-align:left;width:100%;cursor:pointer}
.notif.unread{border-color:color-mix(in srgb,var(--p) 38%,transparent)}
.notif .dot{position:absolute;top:16px;right:15px;width:8px;height:8px;border-radius:50%;background:var(--ter)}
.notif .nic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bell{position:relative}
.bell .bdg{position:absolute;top:-3px;right:-3px;background:var(--ter);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
/* ═══ GRADE ═══ */
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.tier{background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:16px 10px;text-align:center;font-size:11.5px;color:var(--g)}
.tier b{display:block;font-family:var(--fd);font-size:15px;color:var(--dk);margin-top:5px}
.tier.cur{border-color:var(--green);border-width:2px;box-shadow:var(--shf)}
.tier .tic{font-size:20px}
/* ═══ AVIS ═══ */
.avg{display:flex;gap:26px;align-items:center;background:var(--w);border:1.5px solid var(--bd);border-radius:var(--rl);padding:22px 24px;margin-bottom:14px;flex-wrap:wrap}
.avg .n{font-family:var(--fd);font-size:54px;font-weight:800;color:var(--dk);line-height:1}
.distb{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.distb .l{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g)}
.distb .t{flex:1;height:7px;background:var(--bgw);border-radius:4px;overflow:hidden}
.distb .t i{display:block;height:100%;background:var(--sun);border-radius:4px}
.rev{background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:16px}
.rev .rh{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.rev .stars{color:var(--sun);display:flex;gap:1px}
.star-pick{display:flex;gap:4px}
.star-pick button{background:none;border:none;padding:0;cursor:pointer;color:var(--bd);line-height:0;transition:color .12s,transform .12s}
.star-pick button.on{color:var(--sun)}
.star-pick button:hover{transform:scale(1.18)}
.rev-form{background:color-mix(in srgb,var(--sun) 7%,transparent);border:1.5px dashed color-mix(in srgb,var(--sun) 45%,transparent);border-radius:14px;padding:14px 16px;margin-top:10px}
.rev-form textarea{width:100%;margin-top:10px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;font-size:13.5px;background:var(--w);color:var(--dk);outline:none;min-height:60px;resize:vertical;font-family:var(--f)}
.rev-form textarea:focus{border-color:var(--p)}
/* ═══ CARTE DU QUARTIER ═══ */
/* ═══ TOGGLES / PARAMS ═══ */
.tgl{width:46px;height:26px;border-radius:999px;background:var(--bd);border:none;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer}
.tgl.on{background:var(--green)}
.tgl i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on i{left:23px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px dashed var(--bd)}
.set-row:last-child{border-bottom:none}
/* ═══ CERCLE+ ═══ */
.plus-hero{background:linear-gradient(150deg,#5B21B6,#7C3AED 60%,#8B5CF6);border-radius:var(--rl);color:#fff;padding:30px 28px;margin-bottom:18px;position:relative;overflow:hidden}
.plus-hero h2{color:#fff;font-size:clamp(22px,3vw,30px);margin-bottom:6px}
.plus-hero .pp{font-family:var(--fd);font-size:34px;font-weight:800}
.plus-hero .pp small{font-size:14px;font-weight:500;opacity:.8}
.plus-feat{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--bd)}
.plus-feat:last-child{border:none}
.plus-feat .pk{color:var(--plus);font-weight:800;flex-shrink:0}
.sim{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px}
.sim input[type=range]{flex:1;accent-color:var(--plus);min-width:140px}
.sim .out{font-family:var(--fd);font-size:24px;font-weight:800;color:var(--plus);min-width:64px;text-align:right}
/* ═══ LÉGAL ═══ */
.legal p{margin-bottom:13px;color:var(--tx);max-width:70ch;font-size:14.5px}
.legal h3{font-family:var(--fd);font-size:17px;margin:20px 0 8px}
/* carte v2 */
.ping .ph{transition:transform .2s var(--ease),border-color .2s}
.ping.hl .ph{border-color:var(--ter);transform:scale(1.14)}
/* grades */
.tiers{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tier .fee{font-family:var(--fd);font-size:19px;font-weight:800;color:var(--p);display:block;margin-top:4px}
.tier.done{border-color:color-mix(in srgb,var(--green) 38%,transparent)}
/* auth */
.auth-wrap{max-width:500px;margin:0 auto}
.stepper{display:flex;align-items:flex-start;margin:18px 0 22px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:84px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--gl);text-transform:uppercase;text-align:center}
.step .sdot{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);background:var(--w);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gl);transition:all .25s}
.step.on{color:var(--p)}.step.on .sdot{border-color:var(--p);color:var(--p)}
.step.done{color:var(--green)}.step.done .sdot{border-color:var(--green);background:var(--green);color:#fff}
.sline{flex:1;border-top:2px dashed var(--bd);margin-top:16px}
.sline.done{border-color:var(--green)}
.codes{display:flex;gap:8px;justify-content:center;margin:18px 0}
.codes input{width:44px;height:54px;text-align:center;font-family:var(--fd);font-size:22px;font-weight:800;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--dk);outline:none}
.codes input:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 12%,transparent)}
.demo-code{background:color-mix(in srgb,var(--sun) 16%,transparent);border:1.5px dashed var(--sun);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--dk);text-align:center;margin:10px 0 4px}
.demo-code b{font-family:var(--fd);letter-spacing:.22em;font-size:16px}
/* carte réelle Leaflet */
/* auth facilitée */
.social-btns{display:flex;flex-direction:column;gap:9px}
.social-btns button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--w);font-weight:700;font-size:14px;color:var(--dk);transition:all .15s var(--ease)}
.social-btns button:hover{border-color:var(--dk);transform:translate(-1px,-1px);box-shadow:3px 3px 0 color-mix(in srgb,var(--dk) 10%,transparent)}
.or-sep{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--gl)}
.or-sep::before,.or-sep::after{content:"";flex:1;border-top:1.5px dashed var(--bd)}
/* bannière « 12 minutes » + page proposer */
.cta-banner{display:flex;align-items:center;gap:28px;background:var(--w);border:2px solid var(--dk);border-radius:var(--rl);box-shadow:var(--shf);padding:26px 30px;margin:6px 0 54px;flex-wrap:wrap}
.cta-banner .big{font-family:var(--fd);font-size:clamp(36px,4vw,48px);font-weight:800;color:var(--p);line-height:1;white-space:nowrap;text-align:center}
.cta-banner .big small{display:block;font-size:11px;font-family:var(--f);font-weight:700;color:var(--gl);letter-spacing:.14em;margin-top:4px}
.cta-banner h3{font-family:var(--fd);font-size:clamp(18px,2.2vw,23px);color:var(--dk);margin-bottom:4px}
.cta-banner p{font-size:13.5px;color:var(--g);max-width:52ch}
.create-grid{display:grid;grid-template-columns:1fr 350px;gap:22px;align-items:start}
.cprev{position:sticky;top:88px}
.cprev .card{cursor:default}
.cprev .plabel{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gl);margin-bottom:10px}
.photo-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.photo-pick button{border:2px solid var(--bd);border-radius:10px;overflow:hidden;padding:0;background:none;aspect-ratio:1;transition:all .15s var(--ease)}
.photo-pick button img{width:100%;height:100%;object-fit:cover;display:block}
.photo-pick button:hover{border-color:var(--dk)}
.photo-pick button.on{border-color:var(--ter);box-shadow:2px 2px 0 color-mix(in srgb,var(--dk) 28%,transparent);transform:translate(-1px,-1px)}
.photo-up{border:2px dashed var(--p)!important;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;cursor:pointer;color:var(--p);background:color-mix(in srgb,var(--p) 6%,transparent);font-size:9px;font-weight:700;text-align:center;line-height:1.1;transition:all .15s var(--ease);position:relative;overflow:hidden}
.photo-up:hover{background:color-mix(in srgb,var(--p) 12%,transparent)}
.photo-up.on{border-style:solid!important;border-color:var(--ter)!important}
.photo-up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-up input{display:none}
.photo-up.full{opacity:.4;pointer-events:none}
/* photos sélectionnées (Proposer) */
.photo-sel{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.psel{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:2px solid var(--bd)}
.psel img{width:100%;height:100%;object-fit:cover;display:block}
.psel .cov{position:absolute;bottom:0;left:0;right:0;background:var(--ter);color:#fff;font-size:8.5px;font-weight:800;text-align:center;letter-spacing:.06em;padding:2px 0;text-transform:uppercase}
.psel .prm{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hint{font-size:12px;color:var(--g);margin-top:5px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);cursor:pointer;margin-bottom:14px}
.chk input{margin-top:2px;width:17px;height:17px;flex-shrink:0;accent-color:var(--ter);cursor:pointer}
.chk span{display:flex;flex-direction:column;gap:2px}
.chk b{font-size:13.5px;color:var(--dk)}
.chk small{font-size:11.5px;color:var(--g);line-height:1.45}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:none;background:none;padding:9px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--g);cursor:pointer;font-family:var(--f)}
.seg button.on{background:var(--ter);color:#fff}
.propill{display:inline-block;background:var(--p);color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.addr{position:relative}
.addr-load{position:absolute;right:12px;top:11px;color:var(--gl);font-size:16px;pointer-events:none}
.addr-sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:var(--w);border:1.5px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(32,36,47,.14);overflow:hidden;max-height:240px;overflow-y:auto}
.addr-sug button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--dk);font-family:var(--f);line-height:1.4;border-bottom:1px solid var(--bd)}
.addr-sug button:last-child{border-bottom:none}
.addr-sug button:hover{background:color-mix(in srgb,var(--ter) 10%,transparent)}
.addr-sug button svg{flex-shrink:0;margin-top:2px;color:var(--ter)}
.nudge{display:flex;gap:12px;align-items:center;background:var(--w);border:2px solid var(--dk);border-radius:16px;box-shadow:var(--shf);padding:12px 16px;margin:14px 0 0;flex-wrap:wrap}
.pwm{margin-top:8px}
.pwm-bar{display:flex;gap:4px;margin-bottom:6px}
.pwm-seg{flex:1;height:5px;border-radius:3px;background:var(--bd);transition:background .25s}
.pwm-lvl{font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pwm-checks{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--g)}
.pwm-checks span{display:inline-flex;align-items:center;gap:4px;transition:color .2s}
.pwm-checks span.ok{color:var(--green);font-weight:600}
.pwm-checks span b{font-size:11px}
.gain{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--green) 9%,transparent);border:1px solid color-mix(in srgb,var(--green) 28%,transparent);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--greend);font-weight:600;margin-top:6px}
.reveal{opacity:0;transform:translateY(22px)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--dk);color:var(--bg);padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:920px){
  .hero,.det-body{grid-template-columns:1fr}
  .radar{height:330px;max-width:430px;margin:0 auto;width:100%}
  .nav-d{display:none}
  .mnav{display:flex}
  body{padding-bottom:74px}
  .f-grid{grid-template-columns:1fr 1fr}
  .guars{grid-template-columns:1fr}
  .det-gal{grid-template-columns:1fr}.det-gal .gcol{grid-template-rows:none;grid-template-columns:1fr 1fr}
  .ticket{position:static}
  .fr{grid-template-columns:1fr}
  .prof-stats{grid-template-columns:1fr 1fr}
  .side-list{max-height:none}
  .create-grid{grid-template-columns:1fr}
  .cprev{position:static}
  .photo-pick{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  .hdr .cta-txt{display:none}
  .hdr .btn{padding:11px 13px;min-height:42px}
  .hdr .wrap{gap:8px;padding:0 14px}
  .step{width:64px;font-size:9px}
  .step .sdot{width:30px;height:30px}
  .cta-banner{padding:20px;gap:18px}
  .ping .lbl{max-width:96px;overflow:hidden;text-overflow:ellipsis}
  .kpis{grid-template-columns:1fr 1fr}
  .hub{grid-template-columns:1fr}
  .row-card{flex-wrap:wrap}
  .row-card>img{width:46px;height:46px}
  .avg{gap:18px;padding:18px}
  .avg .n{font-size:42px}
  .chart .bars{gap:6px}
  .page{padding:22px 18px 80px}
  .det{padding:16px 18px 60px}
  .hero{padding:28px 18px 20px}
  .owner-card{flex-wrap:wrap}
  .owner-card button{margin-left:58px}
  .f-low{flex-direction:column;align-items:flex-start}
}

/* ═══════════ ADMINISTRATION ═══════════ */
.adm-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-top:16px}
.adm-card{background:var(--w);border:1.5px solid var(--bd);border-radius:var(--rl);padding:16px}
.adm-k{font-size:9.5px;font-weight:800;letter-spacing:1.3px;color:var(--gl);margin-bottom:7px}
.adm-v{font-family:var(--fd);font-weight:700;font-size:29px;letter-spacing:-1px;color:var(--dk);
  font-variant-numeric:tabular-nums;line-height:1.05}
.adm-sub{font-size:11.5px;color:var(--g);margin-top:5px}
.adm-bar{display:flex;height:7px;border-radius:999px;overflow:hidden;background:var(--bgw);margin:11px 0 9px;gap:2px}
.adm-bar span{display:block}
.adm-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--g)}
.adm-leg span{display:flex;align-items:center;gap:5px}
.adm-leg i{width:8px;height:8px;border-radius:50%;display:block}
.adm-leg b{color:var(--dk);font-variant-numeric:tabular-nums}

/* Histogramme : une colonne par jour, application au-dessus du site. */
.adm-spark{display:flex;align-items:flex-end;gap:2px;height:86px;margin-top:12px}
.adm-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;height:100%;min-width:2px}
.adm-col i{display:block;border-radius:2px;min-height:0}
.adm-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--gl);margin-top:6px}

.adm-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}
.adm-row:last-child{border-bottom:0}

.adm-t{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.adm-t th{text-align:left;font-size:9.5px;font-weight:800;letter-spacing:1.1px;color:var(--gl);
  padding:9px 10px;border-bottom:1.5px solid var(--bd)}
.adm-t td{padding:10px;border-bottom:1px solid var(--bd);color:var(--tx)}
.adm-t tr:last-child td{border-bottom:0}
.adm-tag{font-size:10px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.adm-tag.app{background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p)}
.adm-tag.web{background:color-mix(in srgb,var(--ter) 14%,transparent);color:var(--ter)}
.adm-st{font-size:10px;font-weight:800;border-radius:999px;padding:3px 9px;text-transform:capitalize}
.adm-st.pending{background:#FBEBD4;color:#B5711F}
.adm-st.confirmed{background:#E1F1E7;color:var(--green)}
.adm-st.cancelled,.adm-st.declined{background:var(--bgw);color:var(--g)}
</style>
</head>

<div id="root"></div>
<script src="app.js"></script>
</body>
