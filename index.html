<style>
:root{
  --bg:#F7F3EA;--bgw:#F0EADB;--w:#FFFFFF;
  --dk:#20242F;--tx:#343A46;--g:#6A7078;--gl:#A39B89;--bd:#E8E1D2;
  --p:#2C50C8;--pd:#1F3CA6;--ter:#DA6740;--terd:#C2552F;--sun:#EFA528;
  --green:#1F8150;--greend:#15623C;--plus:#7C3AED;
  --fd:'Bricolage Grotesque',system-ui,sans-serif;--f:'Instrument Sans',system-ui,sans-serif;
  --r:14px;--rl:18px;
  --sh:0 1px 2px rgba(32,36,47,.05),0 4px 14px rgba(32,36,47,.05);
  --shf:4px 4px 0 rgba(32,36,47,.12);
  --ease:cubic-bezier(.22,1,.36,1);
}
html.dark{
  --bg:#14171F;--bgw:#1A1F2B;--w:#1E2433;
  --dk:#F0EFE9;--tx:#D9D6CC;--g:#9AA0AC;--gl:#6E7480;--bd:#272D3A;
  --p:#7E9BFF;--pd:#5F82F2;--ter:#FF8E68;--terd:#E9744D;--sun:#FFC369;
  --green:#5BD992;--greend:#3FB876;
  --sh:0 2px 8px rgba(0,0,0,.45);--shf:4px 4px 0 rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s;overflow-x:hidden}
::selection{background:var(--sun);color:#20242F}
h1,h2,h3,.fd{font-family:var(--fd);color:var(--dk);line-height:1.12}
button{font-family:var(--f);cursor:pointer}
input,textarea,select{font-family:var(--f)}
:focus-visible{outline:3px solid var(--ter);outline-offset:2px;border-radius:4px}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ═══ HEADER ═══ */
.hdr{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1.5px solid color-mix(in srgb,var(--dk) 16%,transparent)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;background:none;border:none}
.logo .lt{font-family:var(--fd);font-size:23px;font-weight:700;color:var(--dk);letter-spacing:-.02em}
.nav-d{display:flex;gap:2px}
.nav-d button{background:none;border:none;font-size:14px;font-weight:600;color:var(--g);padding:9px 14px;border-radius:999px;transition:all .2s var(--ease);position:relative}
.nav-d button:hover{color:var(--dk);background:var(--bgw)}
.nav-d button.on{color:var(--p);background:color-mix(in srgb,var(--p) 10%,transparent)}
.hdr-r{display:flex;align-items:center;gap:9px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--bd);background:var(--w);color:var(--dk);display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.icon-btn:hover{border-color:var(--dk);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:none;border-radius:12px;font-weight:700;font-size:14px;padding:11px 20px;min-height:42px;transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .2s;text-decoration:none}
.btn-ter{background:var(--ter);color:#fff}
.btn-ter:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 color-mix(in srgb,var(--dk) 80%,transparent)}
.btn-ter:active{transform:translate(0,0);box-shadow:none}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 color-mix(in srgb,var(--dk) 80%,transparent)}
.btn-ghost{background:var(--w);color:var(--dk);border:1.5px solid var(--bd)}
.btn-ghost:hover{border-color:var(--dk)}

/* ═══ HERO RADAR ═══ */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;max-width:1180px;margin:0 auto;padding:clamp(34px,5.5vw,60px) 24px clamp(26px,4vw,44px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--w);border:1.5px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--dk);margin-bottom:18px;box-shadow:var(--sh)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.hero h1{font-size:clamp(33px,4.5vw,54px);font-weight:800;letter-spacing:-.02em}
.hero h1 .bl{color:var(--p)}
.sould{position:relative;white-space:nowrap}
.sould svg{position:absolute;left:0;bottom:-6px;width:100%;height:10px;overflow:visible}
.sould path{stroke:var(--ter);stroke-width:4.5;fill:none;stroke-linecap:round}
.hero .sub{color:var(--g);font-size:clamp(14px,1.6vw,16px);max-width:46ch;margin:16px 0 22px;line-height:1.65}
.hsearch{display:flex;align-items:center;gap:10px;background:var(--w);border:2px solid var(--dk);border-radius:16px;padding:7px 7px 7px 16px;max-width:520px;box-shadow:var(--shf)}
.hsearch svg{color:var(--g);flex-shrink:0}
.hsearch input{flex:1;border:none;outline:none;font-size:15px;color:var(--dk);background:none;min-width:0}
.hsearch input::placeholder{color:var(--gl)}
.proof{display:flex;gap:20px;margin-top:22px;align-items:center;flex-wrap:wrap}
.proof b{font-family:var(--fd);font-size:20px;color:var(--dk);display:block;line-height:1.1}
.proof span{font-size:12px;color:var(--g)}
.proof .sep{width:1px;height:30px;background:var(--bd)}
.radar{position:relative;height:clamp(320px,36vw,420px)}
.radar svg.rings{position:absolute;inset:0;width:100%;height:100%}
.rings circle{fill:none;stroke:var(--bd);stroke-width:1.5}
.rings circle.dash{stroke-dasharray:2 8;stroke-linecap:round}
.rings text{font-family:var(--f);font-size:10px;fill:var(--gl);font-weight:600}
.you{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--dk);color:var(--bg);font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;z-index:3;white-space:nowrap}
.you i{position:absolute;left:50%;top:50%;width:30px;height:30px;border:2px solid var(--p);border-radius:50%;transform:translate(-50%,-50%);opacity:0;animation:pulse 2.4s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{opacity:.5;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
.ping{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;z-index:2;transform:translate(-50%,-50%);background:none;border:none;will-change:transform}
.ping .ph{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--w);box-shadow:0 4px 14px rgba(32,36,47,.25);overflow:hidden;position:relative;background:var(--w)}
.ping .ph img{width:100%;height:100%;object-fit:cover}
.ping .pt{position:absolute;right:0;bottom:13px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid var(--w);z-index:2}
.ping .lbl{background:var(--w);border:1.5px solid var(--bd);border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:700;color:var(--dk);white-space:nowrap;box-shadow:var(--sh)}
.ping .lbl b{color:var(--green)}
.ping:hover .ph{border-color:var(--p)}

/* ═══ CATÉGORIES ═══ */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 24px 18px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--bd);background:var(--w);font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;transition:all .18s var(--ease);flex-shrink:0;min-height:40px}
.cat svg{width:15px;height:15px}
.cat:hover{border-color:var(--dk);transform:translateY(-1px)}
.cat.on{background:var(--p);border-color:var(--p);color:#fff}

/* ═══ GRILLE & CARTES ═══ */
.sec-t{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--dk);letter-spacing:-.01em;display:flex;align-items:baseline;gap:12px}
.sec-t small{font-size:13px;color:var(--g);font-family:var(--f);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;padding:18px 0 56px}
.card{background:var(--w);border:1.5px solid color-mix(in srgb,var(--dk) 13%,transparent);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;position:relative}
.card:hover{transform:translate(-3px,-3px);border-color:var(--dk);box-shadow:6px 6px 0 color-mix(in srgb,var(--dk) 13%,transparent)}
.card .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bgw)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card:hover .ph img{transform:scale(1.05)}
.stamp{position:absolute;top:10px;left:10px;z-index:2;width:46px;height:46px;border-radius:50%;border:2px solid var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--w) 90%,transparent);color:var(--green);transform:rotate(-9deg);font-size:6.5px;font-weight:800;letter-spacing:.05em;line-height:1.25}
.stamp::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed var(--green)}
.stamp .ck{font-size:11px;line-height:1}
.dist{position:absolute;bottom:10px;left:10px;z-index:2;background:color-mix(in srgb,#20242F 86%,transparent);backdrop-filter:blur(6px);color:#fff;padding:5px 11px;border-radius:999px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.fav{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--w) 92%,transparent);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--dk);transition:transform .2s var(--ease)}
.fav:hover{transform:scale(1.12)}
.fav.on{color:var(--ter);border-color:var(--ter)}
.card .in{padding:14px 16px 16px}
.card .tt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .tt h3{font-size:15.5px;font-weight:700;font-family:var(--f);color:var(--dk);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .note{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--dk);flex-shrink:0}
.card .note svg{color:var(--sun)}
.card .own{font-size:12.5px;color:var(--g);margin-top:4px}
.card .foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:11px;border-top:1px dashed var(--bd)}
.prix{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--green)}
.prix small{font-size:12px;font-weight:500;color:var(--g);font-family:var(--f)}
.marche{font-size:12px;color:var(--g);font-style:italic}

/* ═══ FOOTER ═══ */
footer{border-top:1.5px solid color-mix(in srgb,var(--dk) 14%,transparent);background:var(--bgw);margin-top:30px}
footer .wrap{padding:46px 24px 28px}
.f-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px;margin-bottom:34px}
.f-grid h4{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gl);margin-bottom:12px;font-family:var(--f)}
.f-grid a{display:block;font-size:13.5px;color:var(--g);text-decoration:none;padding:4px 0;cursor:pointer}
.f-grid a:hover{color:var(--p)}
.f-low{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding-top:18px;font-size:12px;color:var(--g);flex-wrap:wrap;gap:10px}

/* ═══ DÉTAIL ═══ */
.det{max-width:1180px;margin:0 auto;padding:20px 24px 70px}
.back{display:inline-flex;align-items:center;gap:7px;background:var(--w);border:1.5px solid var(--bd);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--dk);margin-bottom:18px;transition:all .2s}
.back:hover{border-color:var(--dk)}
.det-gal{display:grid;grid-template-columns:2fr 1fr;gap:10px;border-radius:var(--rl);overflow:hidden;margin-bottom:24px}
.det-gal .g0{aspect-ratio:16/10;position:relative}
.det-gal .gcol{display:grid;grid-template-rows:1fr 1fr;gap:10px}
.det-gal img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--dk) 12%,transparent)}
.det-body{display:grid;grid-template-columns:1fr 390px;gap:36px;align-items:start}
.det h1{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.det .meta{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--g);flex-wrap:wrap}
.det .meta b{color:var(--dk)}
.det .meta .st{color:var(--sun)}
.trajet{display:inline-flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--p) 9%,transparent);border:1px solid color-mix(in srgb,var(--p) 25%,transparent);border-radius:12px;padding:10px 16px;margin:14px 0 20px;font-size:13.5px;font-weight:700;color:var(--p)}
.guars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.guar{background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:13px 15px}
.guar b{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--dk);margin-bottom:3px}
.guar b svg{color:var(--green);flex-shrink:0}
.guar span{font-size:12px;color:var(--g)}
.det h3.sh{font-family:var(--fd);font-size:18px;margin:20px 0 8px}
.det p.desc{max-width:60ch;color:var(--tx)}
.owner-card{display:flex;align-items:center;gap:13px;background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:14px 16px;margin-top:18px;max-width:430px}
.avat{width:46px;height:46px;border-radius:50%;background:var(--p);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--fd)}
.owner-card .nm{font-weight:700;color:var(--dk);font-size:14.5px}
.owner-card .sb{font-size:12px;color:var(--g)}
.owner-card button{margin-left:auto}
/* ticket réservation */
.ticket{position:sticky;top:88px;background:var(--w);border:2px solid var(--dk);border-radius:var(--rl);box-shadow:var(--shf);overflow:hidden}
.ticket .th{padding:20px 22px 14px;display:flex;justify-content:space-between;align-items:baseline}
.ticket .th .prix{font-size:26px}
.caution{font-size:11px;font-weight:800;color:var(--green);border:2px solid var(--green);border-radius:999px;padding:5px 11px;transform:rotate(-3deg);letter-spacing:.03em}
.ticket .tb{padding:0 22px 22px}
.dates{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--bg)}
.dates>label{padding:10px 14px;cursor:pointer}
.dates>label:first-child{border-right:1.5px solid var(--bd)}
.dates span{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
.dates input{border:none;background:none;font-family:var(--f);font-size:14px;font-weight:700;color:var(--dk);width:100%;outline:none}
.calc{display:flex;flex-direction:column;gap:8px;border-top:1.5px dashed var(--bd);padding-top:14px}
.calc .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--g)}
.calc .row b{color:var(--dk);font-weight:600}
.calc .tot{display:flex;justify-content:space-between;border-top:1.5px dashed var(--bd);padding-top:12px;margin-top:5px;font-weight:800;color:var(--dk);font-size:16px}
.calc .tot b{font-family:var(--fd);font-size:19px;color:var(--green)}
.ticket .btn-green{width:100%;margin-top:14px;padding:14px;font-size:15px}
.ticket .note{text-align:center;font-size:11.5px;color:var(--g);margin-top:10px}
.ticket .perfo{position:relative;height:0;border-top:2px dashed var(--bd);margin:0 -8px}
.ticket .perfo::before,.ticket .perfo::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--dk)}
.ticket .perfo::before{left:-10px;border-left-color:transparent;border-top-color:transparent}
.ticket .perfo::after{right:-10px}

/* ═══ PAGES SIMPLES ═══ */
.page{max-width:880px;margin:0 auto;padding:28px 24px 80px}
.page h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.page .lead{color:var(--g);margin-bottom:26px}
.panel{background:var(--w);border:1.5px solid var(--bd);border-radius:var(--rl);padding:24px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dk);margin-bottom:6px}
.fg input,.fg textarea,.fg select{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;font-size:14px;background:var(--bg);color:var(--dk);outline:none;transition:border-color .2s,box-shadow .2s}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 12%,transparent)}
.fg textarea{min-height:90px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* messages */
.msg-l{display:flex;flex-direction:column;gap:10px}
.conv{display:flex;gap:12px;align-items:center;background:var(--w);border:1.5px solid var(--bd);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s var(--ease);text-align:left;width:100%}
.conv:hover{border-color:var(--dk);transform:translate(-2px,-2px);box-shadow:4px 4px 0 color-mix(in srgb,var(--dk) 10%,transparent)}

const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function useReveal(deps){
  useEffect(()=>{
    if(typeof gsap==="undefined")return;
    if(reduced()){document.querySelectorAll('.reveal').forEach(el=>{el.style.opacity=1;el.style.transform='none'});return;}
    const els=document.querySelectorAll('.reveal');
    gsap.to(els,{opacity:1,y:0,duration:.6,stagger:.05,ease:"power3.out",overwrite:"auto"});
  },deps);
}

/* ═══════════ CARTE DU QUARTIER (Leaflet + OSM) ═══════════ */
const CENTER=[49.0975,6.1844]; /* Metz Sablon (défaut) */
const __geoCache={};
async function geocode(q){
  if(!q)return null;
  if(__geoCache[q])return __geoCache[q];
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q+", France"));
    const a=await r.json();
    if(a&&a[0]){const c=[+a[0].lat,+a[0].lon];__geoCache[q]=c;return c;}
  }catch(e){}
  return null;
}
function posFor(id,c){
  c=c||CENTER;
  const d=distFor(id);
  const h=String(id).split("").reduce((a,ch)=>(a*37+ch.charCodeAt(0))%997,13);
  const rad=((h*137.508)%360)*Math.PI/180;
  return [c[0]+(d.m*Math.cos(rad))/111111, c[1]+(d.m*Math.sin(rad))/(111111*Math.cos(c[0]*Math.PI/180))];
}
function Carte({open,items,dark,user}){
  const[cc,setCc]=useState("all");
  const[ray,setRay]=useState(1000);
  const[hl,setHl]=useState(null);
  const[ctr,setCtr]=useState(CENTER);
  const mapEl=useRef(null),mapRef=useRef(null),tileRef=useRef(null),layerRef=useRef(null),elsRef=useRef({}),circlesRef=useRef([]),youRef=useRef(null);
  const quartier=(user&&user.quartier)||"Metz Sablon";
  const list=useMemo(()=>items
    .filter(i=>(cc==="all"||i.c===cc)&&distFor(i.id).m<=ray)
    .map(i=>({it:i,d:distFor(i.id)}))
    .sort((a,b)=>a.d.m-b.d.m).slice(0,20),[items,cc,ray]);
  /* géocodage de l'adresse du membre → centre de la carte */
  useEffect(()=>{let ok=true;geocode(quartier).then(c=>{if(ok&&c)setCtr(c)});return()=>{ok=false}},[quartier]);
  /* init */
  useEffect(()=>{
    if(typeof L==="undefined"||!mapEl.current||mapRef.current)return;
    const map=L.map(mapEl.current,{scrollWheelZoom:false,zoomControl:true,attributionControl:true}).setView(ctr,14.8);
    map.on("click",()=>map.scrollWheelZoom.enable());
    mapRef.current=map;
    circlesRef.current=[[250,"2 7"],[500,null],[1000,"2 7"]].map(([r,dash])=>L.circle(ctr,{radius:r,fill:false,color:"#A39B89",weight:1.5,dashArray:dash,opacity:.7}).addTo(map));
    youRef.current=L.marker(ctr,{icon:L.divIcon({className:"lf-wrap",html:'<div class="lf-you">Chez vous</div>',iconSize:[86,28],iconAnchor:[43,14]}),interactive:false,zIndexOffset:1000}).addTo(map);
    layerRef.current=L.layerGroup().addTo(map);
    return()=>{map.remove();mapRef.current=null};
  },[]);
  /* recentrage quand l'adresse géocode */
  useEffect(()=>{
    const map=mapRef.current;if(!map)return;
    circlesRef.current.forEach(c=>c.setLatLng(ctr));
    if(youRef.current)youRef.current.setLatLng(ctr);
    map.flyTo(ctr,ray===250?16.4:ray===500?15.6:14.8,{duration:.6});
  },[ctr]);
  /* fond de carte jour/nuit */
  useEffect(()=>{
    const map=mapRef.current;if(!map)return;
    if(tileRef.current)map.removeLayer(tileRef.current);
    tileRef.current=L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark?"dark_all":"light_all"}/{z}/{x}/{y}{r}.png`,
      {attribution:'© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>',subdomains:"abcd",maxZoom:19}).addTo(map);
  },[dark]);
  /* zoom selon rayon */
  useEffect(()=>{const m=mapRef.current;if(m)m.flyTo(ctr,ray===250?16.4:ray===500?15.6:14.8,{duration:.6})},[ray]);
  /* markers */
  useEffect(()=>{
    const lg=layerRef.current;if(!lg)return;
    lg.clearLayers();elsRef.current={};
    list.forEach(({it,d})=>{
      const mk=L.marker(posFor(it.id,ctr),{icon:L.divIcon({className:"lf-wrap",
        html:`<div class="lf-ping" data-id="${it.id}"><span class="ph"><img src="${seed(it.img[0],120,120)}" alt=""/></span><span class="lbl"><b>${it.p} €/j</b> · ${d.m} m</span></div>`,
        iconSize:[120,80],iconAnchor:[60,40]})});
      mk.on("click",()=>open(it));
      mk.on("mouseover",()=>setHl(it.id));mk.on("mouseout",()=>setHl(null));
      mk.on("add",()=>{const el=mk.getElement()?.querySelector(".lf-ping");if(el)elsRef.current[it.id]=el;});
      lg.addLayer(mk);
    });
  },[list,open,ctr]);
  /* surlignage liste ↔ carte */
  useEffect(()=>{
    Object.entries(elsRef.current).forEach(([id,el])=>el.classList.toggle("hl",id===hl));
  },[hl]);
  return <div className="page" style={{maxWidth:1180}}>
    <h1>La carte du quartier</h1>
    <p className="lead">La vraie carte, vos vrais voisins — chaque objet à sa distance.</p>
    <div className="radius-chips" role="tablist" aria-label="Catégories">
      {CATS.map(c=><button key={c.id} role="tab" aria-selected={cc===c.id} className={"cat"+(cc===c.id?" on":"")} onClick={()=>setCc(c.id)}>{c.label}</button>)}
    </div>
    <div className="radius-chips" aria-label="Rayon de recherche">
      {[[250,"250 m"],[500,"500 m"],[1000,"1 km"]].map(([v,l])=><button key={v} className={"cat"+(ray===v?" on":"")} style={ray===v?{background:"var(--ter)",borderColor:"var(--ter)"}:undefined} onClick={()=>setRay(v)}>◌ {l}</button>)}
    </div>
    <div className="carte-grid">
      <div className="bigradar">
        <div className="legend" style={{zIndex:500}}>{quartier} · {list.length} objet{list.length>1?"s":""} dans votre rayon</div>
        <div className="lmap" ref={mapEl} aria-label="Carte du quartier"/>
      </div>
      <aside className="side-list" aria-label="Objets triés par distance">
        {list.length===0&&<div className="empty" style={{padding:"40px 12px"}}><div className="big">Rien dans ce rayon</div>Élargissez le cercle ou changez de catégorie.</div>}
        {list.map(({it,d})=><button key={it.id} className={"side-it"+(hl===it.id?" hl":"")} onClick={()=>open(it)} onMouseEnter={()=>setHl(it.id)} onMouseLeave={()=>setHl(null)}>
          <img src={seed(it.img[0],90,90)} alt=""/>
          <span style={{minWidth:0,flex:1}}><span className="ti" style={{display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.t}</span><span className="su">à {d.m} m · {d.min} min à pied · {it.own}</span></span>
          <span className="px">{it.p} €/j</span>
        </button>)}
      </aside>
    </div>
    <p style={{fontSize:12,color:"var(--gl)",marginTop:10}}>Positions approximatives — l'adresse exacte n'est partagée qu'après réservation.</p>
  </div>;
}

function Grade({plus}){
  const g=getGrade(RENTALS),next=getNextGrade(RENTALS),gi=GRADES.indexOf(g);
  const prog=next?Math.round((RENTALS-g.min)/(next.min-g.min)*100):100;
  const eff=Math.round(feeRate(RENTALS,plus)*100);
  return <div className="page">
    <h1>Mon grade</h1>
    <p className="lead">Plus vous partagez, moins le cercle vous coûte — la commission descend avec le grade.</p>

      <div style={{flex:1,minWidth:230}}>

        <div style={{fontSize:13,color:"var(--g)",margin:"3px 0 10px"}}>{RENTALS} locations{next?` — plus que ${(next.min-RENTALS).toLocaleString("fr-FR")} avant le grade ${next.nom} (${next.fee} %)`:" — grade maximal atteint"}</div>
        <div className="prog" style={{marginTop:0}}><i style={{width:prog+"%"}}/></div>

}

const GIcon=()=><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.16 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.93-2.91l-3.87-3a7.18 7.18 0 0 1-10.8-3.77H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.26 14.32a7.2 7.2 0 0 1 0-4.62V6.6H1.27a12 12 0 0 0 0 10.8l3.99-3.08z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43A11.97 11.97 0 0 0 1.27 6.6l3.99 3.1A7.17 7.17 0 0 1 12 4.75z"/></svg>;

function SocialBtns({onDone,toast}){
  const google=async()=>{
    const a=fbAuth();
    if(!a){onDone({name:"Noah",email:"noah@google.demo",phone:"",quartier:"Metz Sablon",verified:true,phoneVerified:false});return}
    try{const res=await a.signInWithPopup(new firebase.auth.GoogleAuthProvider());onDone(fbUserToUser(res.user));}
    catch(e){if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")toast(fbMsg(e));}
  };
  const apple=()=>{
    const a=fbAuth();
    if(!a){onDone({name:"Noah",email:"noah@apple.demo",phone:"",quartier:"Metz Sablon",verified:true,phoneVerified:false});return}
    toast("Connexion Apple — à activer dans la console Firebase");
  };
  return <div className="social-btns">
    <button type="button" onClick={google}><GIcon/>Continuer avec Google</button>
    <button type="button" onClick={apple}><AIcon/>Continuer avec Apple</button>
  </div>;
}
function CodeInput({onFull,autoFocus}){
  const refs=useRef([]);
  useEffect(()=>{if(autoFocus&&refs.current[0])refs.current[0].focus()},[autoFocus]);
  const collect=()=>{const c=refs.current.map(r=>r&&r.value||"").join("");if(c.length===6)onFull(c)};
  return <div className="codes" onPaste={e=>{
      const v=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);
      if(!v)return;e.preventDefault();
      v.split("").forEach((ch,i)=>{if(refs.current[i])refs.current[i].value=ch});
      if(v.length===6)onFull(v);else if(refs.current[v.length])refs.current[v.length].focus();
    }}>
    {[...Array(6)].map((_,i)=><input key={i} maxLength={1} inputMode="numeric" aria-label={"Chiffre "+(i+1)}
      ref={el=>refs.current[i]=el}
      onChange={e=>{const v=e.target.value.replace(/\D/g,"");e.target.value=v;
        if(v&&i<5)refs.current[i+1].focus();collect();}}
      onKeyDown={e=>{if(e.key==="Backspace"&&!e.target.value&&i>0)refs.current[i-1].focus()}}/>)}
  </div>;
}
function Auth({onDone,toast}){
  const FB=!!fbAuth();

  const[step,setStep]=useState(0);
  const[form,setForm]=useState({});

    const name=f.get("n"),email=f.get("e"),pw=f.get("p"),quartier=(f.get("q")||"").trim();
    if(FB){
      setBusy(true);

        const res=await fbAuth().createUserWithEmailAndPassword(email,pw);
        try{await res.user.updateProfile({displayName:name})}catch(_){}
        try{const d=fbDb();if(d)await d.collection("users").doc(res.user.uid).set({name,email,quartier},{merge:true})}catch(_){}
        await sendVerif(res.user,name,email);
        onDone({...fbUserToUser(res.user),quartier});
      }catch(err){toast(fbMsg(err))}
      setBusy(false);
    }else{
      setForm({name,email,phone:"",quartier:quartier||"Metz Sablon"});setCode(genCode());setStep(1);
    }
  };
  const login=async e=>{e.preventDefault();const f=new FormData(e.target);
    const email=f.get("e"),pw=f.get("p");

      try{const res=await fbAuth().signInWithEmailAndPassword(email,pw);onDone(fbUserToUser(res.user));}
      catch(err){toast(fbMsg(err))}
      setBusy(false);

    }

    else toast("Email de réinitialisation envoyé (démo)");

  const sendSms=e=>{e.preventDefault();const f=new FormData(e.target);
    setForm(o=>({...o,phone:f.get("ph")}));setCode(genCode());setPhoneSent(true);};
  const checkPhone=c=>{if(c!==code){toast("Code incorrect — regardez l'encart jaune");return}setPhoneOk(true);setStep(3);};
  const finish=()=>onDone({...form,verified:true,phoneVerified:phoneOk});
  if(mode==="login")return <div className="page auth-wrap">

    <div className="panel">
      <SocialBtns onDone={onDone} toast={toast}/>

        <div className="fg"><label>Email</label><input name="e" type="email" required autoFocus placeholder="vous@exemple.fr"/></div>
        <div className="fg"><label>Mot de passe</label><input name="p" type="password" required placeholder="••••••••"/></div>
        <button className="btn btn-p" disabled={busy} style={{width:"100%",padding:13,opacity:busy?.6:1}}>{busy?"Connexion…":"Se connecter"}</button>
      </form>
      <p style={{textAlign:"center",fontSize:13,color:"var(--g)",marginTop:12}}>
        <a style={{color:"var(--g)",cursor:"pointer",textDecoration:"underline"}} onClick={forgot}>Mot de passe oublié ?</a>
        {" · "}Pas de compte ? <a style={{color:"var(--p)",fontWeight:700,cursor:"pointer"}} onClick={()=>{setMode("signup");setStep(0)}}>Rejoindre le cercle</a>
      </p>
    </div>
  </div>;
  return <div className="page auth-wrap">
    <h1>Rejoindre le cercle</h1>
    <p className="lead">Un clic suffit — ou trois petits champs.</p>
    {!FB&&<div className="stepper">
      {["Compte","Email","Téléphone","Bienvenue"].map((l,i)=><React.Fragment key={l}>
        {i>0&&<div className={"sline"+(step>=i?" done":"")}/>}
        <div className={"step"+(step===i?" on":step>i?" done":"")}><span className="sdot">{step>i?"✓":i+1}</span>{l}{i===2&&<span style={{fontSize:8.5,color:"var(--gl)",textTransform:"none",letterSpacing:0}}>optionnel</span>}</div>
      </React.Fragment>)}

          <button className="btn btn-p" style={{width:"100%",padding:12}}>Recevoir le code par SMS</button>
        </form>
        <button className="btn btn-ghost" style={{width:"100%",marginTop:10}} onClick={()=>setStep(3)}>Plus tard — rejoindre le cercle</button>
      </>}
      {phoneSent&&<>
        <p style={{fontSize:13.5,color:"var(--g)"}}>Un SMS a été envoyé au <b style={{color:"var(--dk)"}}>{form.phone}</b></p>
        <div className="demo-code">Démo — votre code : <b>{code}</b></div>
        <CodeInput autoFocus onFull={checkPhone}/>
        <button className="btn btn-ghost" style={{width:"100%",marginBottom:10}} onClick={()=>checkPhone(code)}>Valider automatiquement (démo)</button>
        <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>setStep(3)}>Plus tard</button>
      </>}
    </div>}
    {step===3&&<div className="panel" style={{textAlign:"center",padding:34}}>
      <div className="stamp" style={{position:"static",width:84,height:84,fontSize:10,margin:"0 auto 16px",transform:"rotate(-8deg)"}}><span className="ck" style={{fontSize:22}}>✓</span><span>VÉRIFIÉ</span></div>
      <h3 style={{fontFamily:"var(--fd)",fontSize:22}}>Bienvenue dans le cercle, {form.name} !</h3>
      <p style={{fontSize:13.5,color:"var(--g)",margin:"6px 0 18px"}}>{phoneOk?"Email et téléphone vérifiés — le tampon est posé.":"Email vérifié — vous pourrez ajouter votre téléphone depuis les paramètres."}</p>
      <button className="btn btn-green" style={{width:"100%",padding:13}} onClick={finish}>Explorer le quartier</button>
    </div>}
  </div>;
}

/* ═══════════ APP ═══════════ */
const ROUTES=["home","carte","favs","messages","profile","create","activite","notifs","avis","grade","plus","params","legal","detail","auth"];
/* ═══════════ BLOCAGE TANT QUE L'EMAIL N'EST PAS VÉRIFIÉ ═══════════ */
function VerifyGate({user,onRefresh,onResend,onLogout}){
  return <>
    <header className="hdr"><div className="wrap">
      <button className="logo"><Logo/><span className="lt">Cercle</span></button>
    </div></header>
    <div className="page auth-wrap">
      <div className="panel" style={{textAlign:"center",padding:34}}>
        <div className="stamp" style={{position:"static",width:88,height:88,fontSize:9,margin:"0 auto 18px",transform:"rotate(-8deg)"}}><span className="ck" style={{fontSize:24}}>✉</span><span>À VÉRIFIER</span></div>
        <h1 style={{fontSize:26}}>Confirmez votre adresse</h1>
        <p style={{fontSize:14,color:"var(--g)",margin:"8px 0 6px",lineHeight:1.6}}>On a envoyé un email à <b style={{color:"var(--dk)"}}>{user.email}</b>. Cliquez sur le lien <b>Confirmer mon adresse</b> pour entrer dans le cercle.</p>
        <p style={{fontSize:12.5,color:"var(--gl)",marginBottom:20}}>Pensez à regarder dans les spams. Le voisinage, c'est la confiance — on vérifie qui rejoint.</p>
        <button className="btn btn-green" style={{width:"100%",padding:14}} onClick={onRefresh}>J'ai confirmé — entrer</button>
        <div style={{display:"flex",gap:10,marginTop:10}}>
          <button className="btn btn-ghost" style={{flex:1}} onClick={onResend}>Renvoyer l'email</button>
          <button className="btn btn-ghost" style={{flex:1}} onClick={onLogout}>Se déconnecter</button>
        </div>
      </div>
    </div>
  </>;
}

function App(){
  const P=useMemo(loadLS,[]);
  const[page,setPage]=useState("home");
  const[sel,setSel]=useState(null);
  const[cat,setCat]=useState("all");
  const[q,setQ]=useState("");
  const[fav,setFav]=useState(()=>new Set(P.fav||[]));
  const[dark,setDark]=useState(P.dark||false);
  const[toastMsg,setToastMsg]=useState(null);
  const[legal,setLegal]=useState("cgu");
  const[notifs,setNotifs]=useState(P.notifs||NOTIFS0);
  const[myItems,setMyItems]=useState(P.myItems||[]);
  const[resas,setResas]=useState(P.resas||RESAS);
  const[convs,setConvs]=useState(P.convs||CONVS);
  const[plus,setPlus]=useState(P.plus||false);
  const[user,setUser]=useState(fbAuth()?null:(P.user||null));
  const[openConv,setOpenConv]=useState(null);
  const[fbItems,setFbItems]=useState([]);
  const items=useMemo(()=>fbDb()?[...fbItems,...myItems,...ITEMS]:[...myItems,...ITEMS],[fbItems,myItems]);
  const itemsRef=useRef(items);useEffect(()=>{itemsRef.current=items},[items]);

  /* persistance */
  useEffect(()=>{saveLS({fav:[...fav],dark,notifs,myItems,resas,convs,plus,user})},[fav,dark,notifs,myItems,resas,convs,plus,user]);
  useEffect(()=>{document.documentElement.classList.toggle("dark",dark)},[dark]);
  /* Firebase : restauration de session */
  useEffect(()=>{
    const a=fbAuth();if(!a)return;
    return a.onAuthStateChanged(fu=>{ if(fu)setUser(u=>u||fbUserToUser(fu)); else setUser(null); });
  },[]);
  /* Firebase : récupère le quartier du membre depuis Firestore */
  useEffect(()=>{
    const d=fbDb();if(!d||!user||!user.uid)return;
    d.collection("users").doc(user.uid).get().then(doc=>{
      if(doc.exists&&doc.data().quartier)setUser(u=>(u&&u.uid===user.uid&&u.quartier!==doc.data().quartier)?{...u,quartier:doc.data().quartier}:u);
    }).catch(()=>{});
  },[user&&user.uid]);
  /* met à jour le quartier (paramètres) */
  const saveQuartier=async q=>{
    setUser(u=>u?{...u,quartier:q}:u);
    const d=fbDb();if(d&&user&&user.uid){try{await d.collection("users").doc(user.uid).set({quartier:q},{merge:true})}catch(_){}}
    toast("Quartier mis à jour");
  };
  /* recharge l'état de vérification email */
  const refreshVerif=async()=>{
    const a=fbAuth();const fu=a&&a.currentUser;if(!fu)return;
    try{await fu.reload()}catch(_){}
    if(fu.emailVerified){setUser(u=>u?{...u,verified:true}:u);toast("Adresse confirmée — bienvenue !");}
    else toast("Pas encore confirmée — cliquez le lien reçu par email");
  };
  /* Firebase : annonces partagées (Firestore) */
  useEffect(()=>{
    const d=fbDb();if(!d)return;
    try{
      return d.collection("v2_listings").orderBy("createdAt","desc").limit(40).onSnapshot(snap=>{
        const arr=[];snap.forEach(doc=>{const x=doc.data();const sd=x.seed||"voisin1";
          arr.push({id:doc.id,t:x.t,c:x.c,p:x.p,d:x.d,img:[sd,sd+"b",sd+"c"],own:x.own||"Voisin",city:x.city||"rue du Sablon",note:x.note||5,rev:x.rev||0});});
        setFbItems(arr);
      },err=>console.warn("[Cercle] Firestore lecture indisponible:",err&&err.code));
    }catch(e){console.warn("[Cercle] Firestore off:",e&&e.code)}
  },[]);

  /* actions */
  const toast=m=>{setToastMsg(m);setTimeout(()=>setToastMsg(null),2600)};
  const togFav=id=>setFav(f=>{const n=new Set(f);n.has(id)?n.delete(id):n.add(id);return n});
  const open=it=>{setSel(it);setPage("detail")};
  const goHome=()=>{setPage("home");setSel(null)};
  const addNotif=n=>setNotifs(ns=>[{id:Date.now(),when:"à l'instant",unread:true,...n},...ns]);
  const markRead=id=>setNotifs(ns=>ns.map(n=>n.id===id?{...n,unread:false}:n));
  const markAll=()=>setNotifs(ns=>ns.map(n=>({...n,unread:false})));
  const openLegal=id=>{setLegal(id);setPage("legal")};
  const unread=notifs.filter(n=>n.unread).length;
  const addItem=async({t,c,p,d,img})=>{
    const sd=img||("voisin"+(Date.now()%9973));
    const dd=d||"Proposé par un voisin du Sablon, avec soin.";
    const db=fbDb();
    if(db&&user){
      try{
        await db.collection("v2_listings").add({t,c,p,d:dd,seed:sd,own:user.name||"Voisin",uid:user.uid||"",city:"rue du Sablon",note:5,rev:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        addNotif({k:"info",txt:`Votre annonce « ${t} » est en ligne dans le cercle.`});
        return;
      }catch(e){console.warn("[Cercle] écriture Firestore échouée, repli local:",e&&e.code);}
    }
    const it={id:"u"+Date.now(),t,c,p,img:[sd,sd+"b",sd+"c"],own:"Vous",city:"rue du Sablon",note:5,rev:0,d:dd};
    setMyItems(m=>[it,...m]);
    addNotif({k:"info",txt:`Votre annonce « ${t} » est en ligne dans le cercle.`});
  };
  const reserve=(it,days,tot)=>{
    setResas(rs=>[{id:Date.now(),it,range:`12 → ${12+days} juin`,st:"a-venir",lbl:"À venir"},...rs]);
    addNotif({k:"resa",txt:`Demande envoyée à ${it.own} pour « ${it.t} » (${tot} €) — débit à sa confirmation.`});
    toast("Demande envoyée à "+it.own+" — suivez-la dans Mon activité");
  };
  const openChat=who=>{
    const target=who==="Vous"?"Léa":who;
    let cv=convs.find(c=>c.who===target);
    if(!cv){cv={id:"c"+Date.now(),who:target,last:"Nouvelle conversation",when:"maintenant",msgs:[]};setConvs(cs=>[cv,...cs]);}
    setOpenConv(cv.id);setPage("messages");
  };
  const subscribe=()=>{
    if(plus){toast("Vous êtes déjà membre Cercle+ ✦");return}
    setPlus(true);
    addNotif({k:"info",txt:"Bienvenue dans Cercle+ ✦ — vos frais de service passent à 10 %."});
    toast("Abonnement Cercle+ activé ✦");
  };
  const go=p=>{if(p!=="messages")setOpenConv(null);setPage(p)};
  const onAuth=u=>{setUser(u);addNotif({k:"info",txt:`Bienvenue dans le cercle, ${u.name} — profil vérifié ✓`});toast("Bienvenue, "+u.name+" !");go("home")};
  const logout=()=>{const a=fbAuth();if(a)try{a.signOut()}catch(e){}setUser(null);toast("À bientôt dans le quartier");go("home")};
  const need=fn=>(...a)=>{if(!user){toast("Rejoignez le cercle pour continuer");go("auth");return}return fn(...a)};

  /* filtre grille */
  const filtered=useMemo(()=>items.filter(i=>(cat==="all"||i.c===cat)&&(!q||i.t.toLowerCase().includes(q.toLowerCase()))),[items,cat,q]);
  useReveal([page,cat,q]);
  useEffect(()=>{if(page!=="detail")window.scrollTo({top:0,behavior:"instant"})},[page]);

  /* routing navigateur (hash + back/forward) */
  const popRef=useRef(false);
  useEffect(()=>{
    const h=(location.hash.slice(2)||"").split("/");
    if(h[0]==="detail"&&h[1]){const it=itemsRef.current.find(i=>i.id===h[1]);if(it){setSel(it);setPage("detail");return}}
    if(ROUTES.includes(h[0]))setPage(h[0]);
  },[]);
  useEffect(()=>{
    if(popRef.current){popRef.current=false;return}
    const target=page==="detail"&&sel?`#/detail/${sel.id}`:`#/${page}`;
    if(location.hash!==target)history.pushState(null,"",target);
  },[page,sel]);
  useEffect(()=>{
    const onPop=()=>{
      popRef.current=true;
      const h=(location.hash.slice(2)||"home").split("/");
      if(h[0]==="detail"&&h[1]){const it=itemsRef.current.find(i=>i.id===h[1]);if(it){setSel(it);setPage("detail");return}}
      setPage(ROUTES.includes(h[0])?h[0]:"home");
    };
    window.addEventListener("popstate",onPop);
    return()=>window.removeEventListener("popstate",onPop);
  },[]);

  /* transition de page GSAP */
  useEffect(()=>{
    if(typeof gsap==="undefined"||reduced())return;
    gsap.fromTo("#pagewrap",{autoAlpha:0,y:12},{autoAlpha:1,y:0,duration:.32,ease:"power2.out",clearProps:"all"});
  },[page]);

  const NavBtn=({id,label})=><button className={page===id?"on":""} onClick={()=>go(id)}>{label}</button>;
  if(user&&fbAuth()&&user.verified===false)
    return <VerifyGate user={user} onRefresh={refreshVerif} onLogout={logout}
      onResend={async()=>{const fu=fbAuth().currentUser;if(fu){await sendVerif(fu,user.name||"voisin",user.email);toast("Email de confirmation renvoyé");}}}/>;
  return <>
    <header className="hdr">
      <div className="wrap">
        <button className="logo" onClick={goHome} aria-label="Accueil Cercle"><Logo/><span className="lt">Cercle{plus&&<span style={{color:"var(--plus)",fontSize:15,verticalAlign:"super"}}>✦</span>}</span></button>
        <nav className="nav-d" aria-label="Navigation">
          <NavBtn id="home" label="Autour"/>
          <NavBtn id="carte" label="Carte"/>
          <NavBtn id="favs" label="Favoris"/>
          <NavBtn id="messages" label="Courrier"/>
          <NavBtn id="profile" label="Profil"/>
        </nav>
        <div className="hdr-r">
          {user&&<button className="icon-btn bell" onClick={()=>go("notifs")} aria-label={"Notifications"+(unread?` (${unread} non lues)`:"")}>
            <I.bell size={16}/>{unread>0&&<span className="bdg">{unread}</span>}
          </button>}
          <button className="icon-btn" onClick={()=>setDark(!dark)} aria-label="Mode nuit">{dark?<I.sun size={16}/>:<I.moon size={16}/>}</button>
          {user
            ?<button className="btn btn-ter" onClick={()=>go("create")} aria-label="Proposer un objet"><I.plus size={14}/><span className="cta-txt">Proposer un objet</span></button>
            :<button className="btn btn-ter" onClick={()=>go("auth")} aria-label="Rejoindre le cercle"><I.user size={14}/><span className="cta-txt">Rejoindre le cercle</span></button>}
          {user&&<button className="icon-btn" onClick={()=>go("profile")} aria-label="Mon profil" style={{background:"var(--p)",color:"#fff",borderColor:"var(--p)",fontWeight:800,fontFamily:"var(--fd)"}}>{user.name[0].toUpperCase()}</button>}
        </div>
      </div>
    </header>

    <div id="pagewrap">
    {page==="home"&&<>
      <Hero items={items} user={user} open={open} onSearch={v=>{setQ(v);document.getElementById("grille")?.scrollIntoView({behavior:reduced()?"instant":"smooth"})}}/>
      <div className="cats" role="tablist" aria-label="Catégories">
        {CATS.map(c=><button key={c.id} role="tab" aria-selected={cat===c.id} className={"cat"+(cat===c.id?" on":"")} onClick={()=>setCat(c.id)}>{c.label}</button>)}
      </div>
      <main className="wrap" id="grille">
        <div className="sec-t">Dans votre cercle de 500 m <small>{filtered.length} objet{filtered.length>1?"s":""}{q?` pour « ${q} »`:""}</small>
          {q&&<button className="back" style={{marginLeft:"auto",marginBottom:0}} onClick={()=>setQ("")}>✕ Effacer</button>}
        </div>
        {filtered.length===0
          ?<div className="empty"><div className="big">Rien trouvé par ici</div>Essayez un autre mot, ou élargissez le cercle.</div>
          :<div className="grid">{filtered.map(it=><Card key={it.id} it={it} open={open} fav={fav.has(it.id)} togFav={togFav}/>)}</div>}
        <div className="cta-banner reveal">
          <div className="big">12 min<small>PAR AN</small></div>
          <div style={{flex:1,minWidth:240}}>
            <h3>Une perceuse s'utilise 12 minutes par an.</h3>
            <p>Le reste du temps, elle dort dans un garage. La vôtre pourrait dépanner toute la rue — et payer vos cafés.</p>
          </div>
          <button className="btn btn-ter" style={{padding:"13px 24px"}} onClick={()=>user?go("create"):go("auth")}>Proposer la mienne</button>
        </div>
      </main>
    </>}

    {page==="detail"&&sel&&<Detail it={sel} backHome={goHome} fav={fav.has(sel.id)} togFav={togFav} toast={toast} reserve={need(reserve)} openChat={need(openChat)} plus={plus}/>}
    {page==="create"&&(user?<Create toast={toast} backHome={goHome} addItem={addItem}/>:<Auth onDone={onAuth} toast={toast}/>)}
    {page==="messages"&&(user?<Messages convs={convs} setConvs={setConvs} openId={openConv} setOpenId={setOpenConv}/>:<Auth onDone={onAuth} toast={toast}/>)}
    {page==="favs"&&<Favs items={items} open={open} fav={fav} togFav={togFav}/>}
    {page==="profile"&&(user?<Profile dark={dark} setDark={setDark} toast={toast} go={go} plus={plus} user={user} logout={logout}/>:<Auth onDone={onAuth} toast={toast}/>)}
    {page==="carte"&&<Carte open={open} items={items} dark={dark} user={user}/>}
    {page==="activite"&&<Activite toast={toast} resas={resas} myItems={myItems}/>}
    {page==="notifs"&&<Notifs notifs={notifs} markRead={markRead} markAll={markAll}/>}
    {page==="avis"&&<Avis/>}
    {page==="grade"&&<Grade plus={plus}/>}
    {page==="plus"&&<Plus toast={toast} plus={plus} subscribe={need(subscribe)}/>}
    {page==="params"&&<Params dark={dark} setDark={setDark} toast={toast} user={user} plus={plus} logout={logout} saveQuartier={saveQuartier}/>}
    {page==="legal"&&<Legal id={legal}/>}
    {page==="auth"&&<Auth onDone={onAuth} toast={toast}/>}
    </div>

    <footer>
      <div className="wrap">
        <div className="f-grid">
          <div>
            <button className="logo" onClick={goHome} style={{marginBottom:10}}><Logo size={32}/><span className="lt" style={{fontSize:19}}>Cercle</span></button>
            <p style={{fontSize:13,color:"var(--g)",maxWidth:"24ch"}}>Location entre voisins — simple, assurée, à deux rues.</p>
          </div>
          <div><h4>Explorer</h4><a onClick={goHome}>Toutes les annonces</a><a onClick={()=>go("carte")}>Carte du quartier</a><a onClick={()=>go("create")}>Proposer un objet</a><a onClick={()=>go("favs")}>Mes favoris</a></div>
          <div><h4>Aide</h4><a onClick={()=>openLegal("assurance")}>Assurance & caution</a><a onClick={()=>openLegal("cgu")}>Conditions générales</a><a onClick={()=>openLegal("contact")}>Nous écrire</a></div>
          <div><h4>Cercle</h4><a onClick={()=>go("grade")}>Les grades</a><a style={{color:"var(--plus)"}} onClick={()=>go("plus")}>✦ Cercle+</a></div>
        </div>
        <div className="f-low"><span>© 2026 Cercle · Tout est à deux rues.</span><span><a style={{display:"inline",cursor:"pointer"}} onClick={()=>openLegal("cgu")}>CGU</a> · <a style={{display:"inline",cursor:"pointer"}} onClick={()=>openLegal("conf")}>Confidentialité</a> · <a style={{display:"inline",cursor:"pointer"}} onClick={()=>openLegal("cookies")}>Cookies</a></span></div>
      </div>
    </footer>

    <nav className="mnav" aria-label="Navigation mobile">
      <button className={page==="home"?"on":""} onClick={goHome}><I.home size={20}/>Autour</button>
      <button className={page==="carte"?"on":""} onClick={()=>go("carte")}><I.pin size={20}/>Carte</button>
      <button className="fab" onClick={()=>go("create")} aria-label="Proposer un objet"><I.plus size={22}/></button>
      <button className={page==="messages"?"on":""} onClick={()=>go("messages")}><I.msg size={20}/>Courrier</button>
      <button className={page==="profile"?"on":""} onClick={()=>go("profile")}><I.user size={20}/>Profil</button>
    </nav>

    {toastMsg&&<div className="toast" role="status">{toastMsg}</div>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
